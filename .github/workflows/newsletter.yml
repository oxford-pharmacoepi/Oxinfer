name: Send Newsletter

on:
  schedule:
    - cron: '0 * * * *'  # Runs at the start of every hour
  workflow_dispatch:      # Allows manual triggering
  pull_request:
    branches: [main]     # Runs on PRs to main branch

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    
    steps:
      - name:️ Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ./packages 
        run: |
          docker build -t send-newsletter .
          docker image ls  # Debug: Verify image exists
    
      - name: Send newsletter
        run: |
          docker run --rm -e GITHUB_PAT=${{ secrets.GITHUB_PAT }} -e OXINFER_GMAIL=${{ secrets.OXINFER_GMAIL }} send-newsletter