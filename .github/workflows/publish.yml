on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 12:00 AM UTC every day
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main 

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v2 
        
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libgit2-dev \
            libx11-dev \
            pandoc
        
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        
      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install R libraries in renv
        uses: r-lib/actions/setup-renv@v2
        
      - name: Render quarto website
        run: quarto render
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}
        
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
          publish_dir: ./_site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download data for shiny app
        run: Rscript shiny/downloadData.R 
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT }}
      
      - name: Create renv file
        run: Rscript -e 'renv::init()'
        working-directory: shiny/app
          
       - name: Deploy to shinyapps.io
        if: github.event_name != 'pull_request'
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: Rscript shiny/deployShiny.R
          